<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Little Learners</title>
<meta name="description" content="A bright, calm first learning app for children aged 3 to 6 — letters, numbers, colours, animals, shapes, words, quizzes and games. Works offline.">

<!-- PWA -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#FFF2E2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#241B3A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Little Learners">
<meta name="screen-orientation" content="landscape">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">

<!-- Fonts. Andika (SIL) is a literacy face: single-storey a and g, a capital I
     with serifs and a hooked l, so letters match what children are taught to
     write. Blocked or offline, the stack in tokens.css falls back to other
     single-storey faces and the app still works. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@500;600;700;800&family=Comic+Neue:wght@400;700&family=Nunito:wght@600;700;800;900&display=swap">

<!-- App styles -->
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/layout.css">
<link rel="stylesheet" href="./css/components.css">
</head>
<body>

<div id="stage">
  <div id="app">
    <header id="topbar">
      <button class="icon-btn" id="btn-back" hidden aria-label="Go back">⬅️</button>
      <h1 class="ttl display"><span id="ttl-main">🌈 Little Learners</span><span class="sub" id="ttl-sub">Learn • Play • Grow</span></h1>
      <div class="starchip" id="starchip" title="Stars earned">⭐ <span id="starcount">0</span></div>
      <button class="icon-btn" id="btn-fullscreen" aria-label="Toggle Fullscreen" title="Full Screen">⛶</button>
      <button class="icon-btn" id="btn-settings" aria-label="Settings">⚙️</button>
    </header>
    <main id="view" tabindex="-1"></main>
    <nav id="tabbar" aria-label="Main">
      <button data-tab="home" aria-current="page"><i>🏠</i>Home</button>
      <button data-tab="learn"><i>📚</i>Learn</button>
      <button data-tab="dictation"><i>✍️</i>Dictation</button>
      <button data-tab="games"><i>🎮</i>Games</button>
      <button data-tab="progress"><i>⭐</i>Progress</button>
    </nav>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
</div>
<div id="rotate-prompt" hidden aria-live="polite">
  <div class="rotate-card">
    <div class="rotate-icon">🔄📱</div>
    <h2>Please Rotate Your Device</h2>
    <p>Little Learners is designed to be played sideways in landscape mode!</p>
  </div>
</div>
<div id="fx" aria-hidden="true"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
